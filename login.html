<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EduLink - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>EduLink Portal</h2>
            <p>نظام المتابعة الإلكتروني للمدارس التكنولوجية</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني للـ User">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button id="loginBtn">تسجيل الدخول </button>
            
            <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></p>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
